<h1>Subir ficheros Angular</h1>
<h3>Selecciona una imagen para subir a la API</h3>
<form #formfichero="ngForm" (ngSubmit)="subirFichero()">
  <label>Seleccionar imagen:</label>
  <input
    type="file"
    accept="image/*"
    #cajafichero
    [disabled]="subiendo"
    (change)="seleccionarFichero($event)"
  />
  <br/>
  <button type="submit" [disabled]="subiendo || !fileContent">
    Subir fichero
  </button>
</form>
@if (fichero) {
  <h3>Nombre: {{ fichero.name }}</h3>
}

<h3 [style.color]="mensaje.startsWith('Error') ? 'red' : 'blue'">
  {{ mensaje }}
</h3>
